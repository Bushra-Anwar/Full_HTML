<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input Tag</title>
</head>
<body>
    <form action ="/submit.php"method ="Post"><!--Specifies the URL to which the form data should be sent when submitted.If no specified,the form will be submitted to the current page's URL,Server-side:Usually points to server-side script(Like PHP,Python,etc)that process the form data,-->
        <input type="Text" Name="Name">
        <input type="Submit" Value="Submit">
    </form>
</body>
</html>
