<!DOCTYPE html>
<html lang="en">
<head>
    <title>Heading Tags</title>
</head>
<body>
    <!--defines heading in a document.
    Ranges from <h1> to <h6>.
        <h1> is most important, <h6> is least.
            Important for SEO(Search Engine Optimization).
            Helps in structuring content-->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
    
</body>
</html>
