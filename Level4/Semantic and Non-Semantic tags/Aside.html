<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aside Tag</title>
</head>
<body>
    <main>
        <aside> <!--The <aside> HTML element represents a portion of a document whose content is only indirectly related to the document's main content. Asides are frequently presented as sidebars or call-out boxes.-->
            <!--This element only includes the global attributes.-->
                <!--Do not use the <aside> element to tag parenthesized text, as this kind of text is considered part of the main flow.-->
            <h3>Recommended Books</h3>
            <ul>
                <li>"Introduction to algorithm"</li>
                <li>"Learn Python the hard way"</li>
            </ul>
        </aside>
    </main>
</body>
</html>
